<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Literature Chronicle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-[#fcfbf9] min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md glass rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-black/5 p-10">
        <div class="text-center mb-10">
            <div class="bg-blue-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-2">New Credentials</h1>
            <p class="text-slate-500 text-sm">Please set a strong password to secure your account.</p>
        </div>

        <form id="resetForm" class="space-y-6">
            <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase tracking-widest text-slate-400 ml-1">New Password</label>
                <input type="password" id="password" required 
                    class="w-full rounded-2xl py-4 px-6 bg-slate-50 border-none focus:ring-2 focus:ring-blue-500/20 transition-all outline-none"
                    placeholder="••••••••">
            </div>
            <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase tracking-widest text-slate-400 ml-1">Confirm Password</label>
                <input type="password" id="confirmPassword" required 
                    class="w-full rounded-2xl py-4 px-6 bg-slate-50 border-none focus:ring-2 focus:ring-blue-500/20 transition-all outline-none"
                    placeholder="••••••••">
            </div>
            <button type="submit" id="submitBtn"
                class="w-full py-5 rounded-2xl bg-slate-900 text-white font-bold text-lg shadow-xl shadow-slate-200 hover:bg-slate-800 transition-all active:scale-[0.98]">
                Set New Password
            </button>
        </form>

        <div id="message" class="hidden mt-6 p-4 rounded-2xl text-center text-sm font-medium"></div>
    </div>

    <script>
        const form = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        // Get token from URL path
        const token = window.location.pathname.split('/').pop();

        form.onsubmit = async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'bg-red-50 text-red-600');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating...';

            try {
                const response = await fetch(`/api/auth/reset-password/${token}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Password Updated! Redirecting...', 'bg-green-50 text-green-600');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000);
                } else {
                    showMessage(data.message || 'Reset failed', 'bg-red-50 text-red-600');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Set New Password';
                }
            } catch (err) {
                showMessage('Connection error. Please try again.', 'bg-red-50 text-red-600');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Set New Password';
            }
        };

        function showMessage(text, classes) {
            messageDiv.textContent = text;
            messageDiv.className = `mt-6 p-4 rounded-2xl text-center text-sm font-medium ${classes}`;
            messageDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
